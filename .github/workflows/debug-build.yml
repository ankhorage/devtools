name: Capture build diagnostics

on:
  push:
    branches:
      - agent/automate-devtools-setup

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/automate-devtools-setup

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Capture build output
        run: |
          set +e
          bun run build > .ci-build-diagnostics.txt 2>&1
          echo "exit_code=$?" >> .ci-build-diagnostics.txt
          set -e

      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci-build-diagnostics.txt
          git commit -m "Capture build diagnostics"
          git push
