name: Patch 217

on:
  push:
    branches:
      - fix/217-zora-plugin-discovery

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/217-zora-plugin-discovery
          fetch-depth: 0
      - name: Apply package-driven plugin discovery
        run: |
          python3 <<'PY'
          from pathlib import Path

          owner = Path('src/tools/skills/assets/zora-designer/scripts/owner-api.ts')
          source = owner.read_text()
          old = """    const minimumVersion =\n      packageName === '@ankhorage/zora-chess'\n        ? '0.2.0'\n        : packageName === '@ankhorage/zora-tabletop'\n          ? '0.1.0'\n          : '0.0.0';\n"""
          new = """    const minimumVersion = resolvePluginMinimumVersion(targetManifest, packageName);\n"""
          if old in source:
              source = source.replace(old, new, 1)
          elif new not in source:
              raise SystemExit('expected plugin minimum-version block not found')

          marker = """function isZoraPluginPackage(packageName: string): boolean {\n  return packageName.startsWith('@ankhorage/zora-') && packageName !== '@ankhorage/zora';\n}\n"""
          helpers = marker + """\n/*** Resolve one ZORA plugin minimum version from the target package declaration or owner package itself. */\nfunction resolvePluginMinimumVersion(\n  targetManifest: Record<string, unknown>,\n  packageName: string,\n): string {\n  if (targetManifest.name === packageName) {\n    const version = targetManifest.version;\n    if (typeof version === 'string' && parseVersion(version)[0] >= 0) return version;\n    throw new Error(`ZORA plugin owner package ${packageName} must declare a semantic version.`);\n  }\n\n  for (const field of ['dependencies', 'devDependencies', 'peerDependencies']) {\n    const dependencies = targetManifest[field];\n    if (!isRecord(dependencies)) continue;\n    const specifier = dependencies[packageName];\n    if (typeof specifier === 'string') {\n      return readPluginMinimumVersion(packageName, specifier);\n    }\n  }\n\n  throw new Error(`ZORA plugin ${packageName} must be declared by the target package.`);\n}\n\n/*** Read the semantic lower bound from one supported published dependency specifier. */\nfunction readPluginMinimumVersion(packageName: string, specifier: string): string {\n  const normalized = specifier.trim().replace(/^workspace:/u, '');\n  const match = /^(?:\\^|~|>=)?(\\d+\\.\\d+\\.\\d+(?:-[0-9A-Za-z.-]+)?)$/u.exec(normalized);\n  const minimumVersion = match?.[1];\n  if (minimumVersion === undefined) {\n    throw new Error(\n      `ZORA plugin ${packageName} must use an exact, caret, tilde, or >= semantic dependency range; found ${specifier}.`,\n    );\n  }\n  return minimumVersion;\n}\n"""
          if helpers not in source:
              if marker not in source:
                  raise SystemExit('isZoraPluginPackage marker not found')
              source = source.replace(marker, helpers, 1)
          owner.write_text(source)

          test = Path('src/tools/skills/zoraDesignerScripts.test.ts')
          test_source = test.read_text()
          anchor = """  it('reports interaction choices from their released owners', async () => {\n"""
          addition = """  it('derives arbitrary ZORA plugin release gates from the consumer dependency', async () => {\n    const target = await createOwnerFixture();\n    await writeJson(join(target, 'package.json'), {\n      name: 'fixture',\n      type: 'module',\n      dependencies: { '@ankhorage/zora-game': '^0.3.1' },\n    });\n    await writeFixturePackage(target, '@ankhorage/zora-game', '0.3.1', {\n      './metadata': './metadata.js',\n      './package.json': './package.json',\n    });\n    await writeFile(\n      join(target, 'node_modules/@ankhorage/zora-game/metadata.js'),\n      `export const ZORA_PLUGIN_METADATA = {\n  packageName: '@ankhorage/zora-game',\n  componentMeta: {\n    GameField: { name: 'GameField', directManifestNode: true, allowedChildren: [], props: {} },\n  },\n  placements: [{ child: 'GameField', parents: ['View'] }],\n};\\n`,\n    );\n\n    const result = await runScript(OWNER_SCRIPT, ['inspect'], target);\n    expect(result.exitCode).toBe(0);\n    const output = JSON.parse(result.stdout) as {\n      components: string[];\n      versions: { plugins: Record<string, string> };\n    };\n    expect(output.components).toContain('GameField');\n    expect(output.versions.plugins['@ankhorage/zora-game']).toBe('0.3.1');\n  });\n\n  it('rejects an installed ZORA plugin below the consumer-declared lower bound', async () => {\n    const target = await createOwnerFixture();\n    await writeJson(join(target, 'package.json'), {\n      name: 'fixture',\n      type: 'module',\n      dependencies: { '@ankhorage/zora-game': '^0.4.0' },\n    });\n    await writeFixturePackage(target, '@ankhorage/zora-game', '0.3.9', {\n      './metadata': './metadata.js',\n      './package.json': './package.json',\n    });\n    await writeFile(\n      join(target, 'node_modules/@ankhorage/zora-game/metadata.js'),\n      `export const ZORA_PLUGIN_METADATA = { packageName: '@ankhorage/zora-game', componentMeta: {} };\\n`,\n    );\n\n    const result = await runScript(OWNER_SCRIPT, ['inspect'], target);\n    expect(result.exitCode).toBe(1);\n    expect(result.stderr).toContain('@ankhorage/zora-game >=0.4.0');\n    expect(result.stderr).toContain('is outdated');\n  });\n\n"""
          if addition not in test_source:
              if anchor not in test_source:
                  raise SystemExit('test insertion anchor not found')
              test_source = test_source.replace(anchor, addition + anchor, 1)
          test.write_text(test_source)

          changeset = Path('.changeset/package-driven-zora-plugins.md')
          changeset.write_text('''---\n"@ankhorage/devtools": patch\n---\n\nDerive ZORA Designer plugin version gates from consumer package declarations so newly published ZORA plugins are discovered without plugin-specific Devtools branches.\n''')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tools/skills/assets/zora-designer/scripts/owner-api.ts src/tools/skills/zoraDesignerScripts.test.ts .changeset/package-driven-zora-plugins.md
          if ! git diff --cached --quiet; then
            git commit -m "fix: make ZORA plugin discovery package-driven"
            git push origin HEAD:fix/217-zora-plugin-discovery
          fi
