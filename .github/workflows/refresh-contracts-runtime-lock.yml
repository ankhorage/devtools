name: Refresh Contracts runtime lock

on:
  push:
    branches:
      - fix/253-contracts-22.1.2-runtime

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: fix/253-contracts-22.1.2-runtime
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Refresh Contracts runtime resolution
        run: bun update @ankhorage/contracts --lockfile-only --ignore-scripts

      - name: Commit lockfile
        run: |
          if git diff --quiet -- bun.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: refresh Contracts runtime lockfile"
          git push origin HEAD:fix/253-contracts-22.1.2-runtime
