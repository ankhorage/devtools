name: Refresh structure generator lock

on:
  push:
    branches:
      - feat/245-structure-descriptor-generator

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feat/245-structure-descriptor-generator
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Refresh generator dependencies
        run: bun install --lockfile-only --ignore-scripts

      - name: Commit lockfile
        run: |
          if git diff --quiet -- bun.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: refresh structure generator lockfile"
          git push origin HEAD:feat/245-structure-descriptor-generator
