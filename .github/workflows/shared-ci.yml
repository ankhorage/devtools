name: Shared CI

on:
  workflow_call:
    inputs:
      bun-version:
        description: Bun version used by the shared CI workflow.
        required: false
        type: string
        default: '1.3.13'
      run-build:
        description: Whether to run `bun run build`.
        required: false
        type: boolean
        default: true
      run-lint:
        description: Whether to run `bun run lint`.
        required: false
        type: boolean
        default: true
      run-format-check:
        description: Whether to run `bun run format:check`.
        required: false
        type: boolean
        default: false
      run-test:
        description: Whether to run `bun run test`.
        required: false
        type: boolean
        default: true
      run-typecheck:
        description: Whether to run `bun run typecheck`.
        required: false
        type: boolean
        default: false
      run-changeset-check:
        description: Whether to run `scripts/check-changeset-status.sh` when present.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run build
        if: inputs.run-build
        run: bun run build

      - name: Run lint
        if: inputs.run-lint
        run: bun run lint

      - name: Run format check
        if: inputs.run-format-check
        run: bun run format:check

      - name: Run tests
        if: inputs.run-test
        run: bun run test

      - name: Run typecheck
        if: inputs.run-typecheck
        run: bun run typecheck

      - name: Check changesets
        if: inputs.run-changeset-check && github.event_name == 'pull_request'
        run: |
          if [ -f ./scripts/check-changeset-status.sh ]; then
            bash ./scripts/check-changeset-status.sh
          else
            echo "No changeset status script found; skipping."
          fi
