name: Shared Release

on:
  workflow_call:
    inputs:
      bun-version:
        description: Bun version used by the shared release workflow.
        required: false
        type: string
        default: '1.3.13'
      node-version:
        description: Node version used for npm publishing setup.
        required: false
        type: string
        default: '24'
      version-command:
        description: Command used by changesets/action to version packages.
        required: false
        type: string
        default: bun run version-packages
      publish-command:
        description: Command used by changesets/action to publish packages.
        required: false
        type: string
        default: bunx changeset publish
      build-command:
        description: Command run before changesets/action.
        required: false
        type: string
        default: bun run build

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Setup Node for npm publishing
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://registry.npmjs.org

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: ${{ inputs.build-command }}

      - name: Create release pull request or publish to npm
        uses: changesets/action@v1
        with:
          version: ${{ inputs.version-command }}
          publish: ${{ inputs.publish-command }}
          commit: Version Packages
          title: Version Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
