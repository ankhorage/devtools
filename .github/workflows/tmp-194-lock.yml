name: Temporary Utility Lock Refresh

on:
  push:
    branches:
      - chore/194-require-utility-0.5.1
    paths:
      - package.json

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Refresh Bun lockfile
        run: bun install
      - name: Commit lockfile
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: refresh utility lockfile [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
